services:
  neon-arcade:
    build: .
    image: neon-pixel-arcade:latest
    container_name: neon-arcade
    restart: unless-stopped
    ports:
      - "${LISTEN_IP:-0.0.0.0}:${PORT:-8080}:${PORT:-8080}/tcp"
    environment:
      PORT: "${PORT:-8080}"
      UUID: "${UUID:-}"
      TOKEN: "${TOKEN:-}"
    volumes:
      - arcade-cache:/app/.cache-sync
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "/app/index.js", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  arcade-cache:
